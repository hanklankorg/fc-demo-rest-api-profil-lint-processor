# The lint plan of the pull request gate: Forge CI runs `nanolinter verify`
# against it. The checks are the ones `just lint-all` runs, with the
# publiccode.yml validation and the SAST and dependency scans the pull
# request gate ran before.
# `nanolinter explain --all` lists more checks.
#
# `just lint-node-ts-types` has no check here: the gate installs no
# dependencies, which tsc needs. The test job compiles the same project
# (`npm test` runs `npm run build` first), so a type error still fails the
# pull request.

[detect]
auto = true

[verify]
checks = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "publiccode",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "node-eslint",
  "node-format",
]

# SAST findings are reported and do not fail the pull request: "sast" runs
# under [verify] and is not listed here.
[policy]
block = [
  "version-control",
  "commits",
  "secrets",
  "osv",
  "publiccode",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "node-eslint",
  "node-format",
]

# The OpenAPI files under apis/ are input for the linter's own tests and some
# are malformed on purpose. .yamlfmt leaves the directory out; the gate hands
# yamlfmt its files itself, so the same exclusion is repeated here.
[verify.filters.yaml]
exclude = "^apis/"

# Markdown as `just lint-markdown` runs it: without the line length rule and
# without the generated changelog.
[verify.filters.markdown]
exclude = "(^|/)CHANGELOG\\.md$"

[linters.markdown.settings]
"rumdl.disable_rules" = ["MD013"]
